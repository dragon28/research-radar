[project]
name = "research-radar"
version = "0.1.0"
description = "Weekly science-news digest: n8n orchestration + a tested Python core"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
