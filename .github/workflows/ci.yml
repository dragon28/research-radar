name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: offline demo (twice; second run must add nothing)
        run: |
          uv run radar demo > demo.json
          python -c "import json;r=json.load(open('demo.json'));assert r['new_items']==5 and r['rerun_new_items']==0, r"
          uv run radar demo | cmp - demo.json
  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync
      - run: cd n8n && npm ci --no-audit --no-fund && npm rebuild sqlite3
      - name: run the real n8n workflow against saved feeds
        run: |
          python -m http.server 8000 --directory sample_data >/dev/null 2>&1 &
          uv run radar serve --feeds config/ci_feeds.toml --db ci/radar.sqlite --out ci/posts &
          sleep 3
          make n8n-import
          make n8n-run | tee n8n.log
          grep -q "Execution was successful" n8n.log
          ls ci/posts/*.md
          pkill -f 'radar serve' || true
          pkill -f 'http.server 8000' || true
